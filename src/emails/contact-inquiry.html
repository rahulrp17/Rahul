<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New portfolio inquiry</title>
  </head>
  <body style="margin:0;padding:0;background-color:#fff5d6;font-family:Arial,Helvetica,sans-serif;color:#000000;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      New inquiry from {{from_name}} — {{subject}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#fff5d6;">
      <tr>
        <td align="center" style="padding:32px 12px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border:4px solid #000000;background-color:#ffffff;">
            <tr>
              <td style="background-color:#000000;padding:18px 22px;border-bottom:4px solid #000000;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="font-size:24px;font-weight:900;letter-spacing:-1px;line-height:1;color:#ffed00;text-transform:uppercase;">
                      Rahul.
                    </td>
                    <td align="right" style="font-size:10px;font-weight:700;letter-spacing:1.6px;line-height:1.2;color:#fff5d6;text-transform:uppercase;">
                      New project inquiry
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="background-color:#ffed00;padding:28px 22px 26px;border-bottom:4px solid #000000;">
                <p style="margin:0 0 10px;font-size:10px;font-weight:700;letter-spacing:1.5px;line-height:1.2;text-transform:uppercase;color:#000000;">
                  Portfolio contact form
                </p>
                <h1 style="margin:0;font-size:32px;font-weight:900;letter-spacing:-1.2px;line-height:0.98;text-transform:uppercase;color:#000000;word-break:break-word;">
                  New message<br />
                  from {{from_name}}
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding:24px 22px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
                  <tr>
                    <td style="width:88px;padding:10px 0;border-bottom:2px solid #000000;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#000000;vertical-align:top;">
                      From
                    </td>
                    <td style="padding:10px 0 10px 14px;border-bottom:2px solid #000000;font-size:14px;font-weight:700;line-height:1.4;color:#000000;word-break:break-word;">
                      {{from_name}}
                    </td>
                  </tr>
                  <tr>
                    <td style="width:88px;padding:10px 0;border-bottom:2px solid #000000;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#000000;vertical-align:top;">
                      Email
                    </td>
                    <td style="padding:10px 0 10px 14px;border-bottom:2px solid #000000;font-size:14px;font-weight:700;line-height:1.4;color:#000000;word-break:break-word;">
                      <a href="mailto:{{from_email}}" style="color:#000000;text-decoration:underline;">{{from_email}}</a>
                    </td>
                  </tr>
                  <tr>
                    <td style="width:88px;padding:10px 0;border-bottom:2px solid #000000;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#000000;vertical-align:top;">
                      Subject
                    </td>
                    <td style="padding:10px 0 10px 14px;border-bottom:2px solid #000000;font-size:14px;font-weight:700;line-height:1.4;color:#000000;word-break:break-word;">
                      {{subject}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:22px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:3px solid #000000;background-color:#fff5d6;">
                  <tr>
                    <td style="padding:18px;">
                      <p style="margin:0 0 10px;font-size:10px;font-weight:700;letter-spacing:1.2px;line-height:1.2;text-transform:uppercase;color:#000000;">
                        Message
                      </p>
                      <p style="margin:0;font-size:15px;font-weight:400;line-height:1.65;color:#000000;white-space:pre-wrap;word-break:break-word;">{{message}}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:0 22px 28px;">
                <a href="mailto:{{from_email}}" style="display:inline-block;padding:13px 20px;border:3px solid #000000;background-color:#ff4332;color:#000000;font-size:11px;font-weight:900;letter-spacing:0.8px;line-height:1.2;text-decoration:none;text-transform:uppercase;">
                  Reply to {{from_name}}
                </a>
              </td>
            </tr>

            <tr>
              <td style="background-color:#000000;padding:16px 22px;">
                <p style="margin:0;font-size:10px;font-weight:700;letter-spacing:1.2px;line-height:1.4;color:#fff5d6;text-transform:uppercase;">
                  Sent from the Rahul portfolio / contact form
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
